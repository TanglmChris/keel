# Keel project configuration.
#
# Eight independent declarations live here: fast_check, which names a command;
# authorize, which names repository actions this project has decided may
# proceed without being asked each time; precedents, which points at a
# directory of decisions already made and the reasoning behind them; triage,
# which names which work may start without being asked about at all;
# delegation, which carries optional capability metadata; full_mode_paths, which names the
# paths whose change always takes the complete flow; executor_tier, which
# names how much stepwise guidance this project's skills should load; and
# merge, which names who merges into the default branch.
#
# fast_check (optional): your project's fast inner-loop check — a
# seconds-scale command run at a local pre-push (see
# `keel --install --with-git-hooks`) and during iteration. The full or slow
# suite belongs to CI or `keel gate change-close`, not the local pre-push.
#
# Example:
#   fast_check: npm test -- --fast
#
# authorize (optional): standing authorization for repository actions. The
# accepted names are the whole vocabulary — commit, push, release, archive,
# continuation, issue:<owner>/<repo>, protocol-refresh, chat-reply:<group> — and an unrecognized entry is reported
# with the accepted names rather than silently granted or silently dropped, so
# the declaration authorizes nothing until it is corrected. An absent or empty
# block authorizes nothing, which is the default and leaves behavior exactly as
# it was before the block existed.
#
# `issue` and `chat-reply` are the names that carry the resource they reach,
# and each is refused without one. `chat-reply:<group>` lets a session answer,
# in that chat group, a record addressed to its role, and nothing the record
# asks for beyond the answer; in a Slack-enabled group a reply leaves the
# machine, which is why the group is named.
#
# For `issue`, the reasoning is that every other name acts on this checkout, so the
# declaration and the thing it permits are the same size; the credentials that
# open an issue are account-wide, so a bare `issue` would silently be the widest
# entry in this file — wider than `push`. Naming the repository is what keeps
# the entry no bigger than what it says. Keel carries that scope to `--doctor`
# and to the compiled capsule and does not enforce it: it invokes no tracker
# client and cannot observe one, exactly as it never commits.
#
# A task that authors no `Autonomy boundary:` inherits what is declared here,
# and the compiled capsule names this file as that entry's source. A task that
# authors its own boundary keeps it; the declaration never overrides one.
#
# `protocol-refresh` covers running the refresh `keel context` names when this
# repository's managed protocol block is older than the running Keel: never
# while a task's write guard is active, and never the commit of what it wrote.
#
# `continuation` is the between-task name: it covers exactly the boundary
# between a durably complete task and the next unchecked task of the same
# change, inside a change whose tasks.md the owner approved, and nothing else.
# The next task still starts through its own gate with its own fingerprint,
# and no repository action rides along with it.
#
# What this does NOT do: it removes the confirmation, never the proof. Every
# gate, evidence requirement, semantic Review, and the write guard run exactly
# as they do without it — `keel gate task-complete` returns the same verdict
# and the same failure text either way. It is also not a trigger: it authorizes
# an action the workflow already reached, and schedules nothing.

# precedents (optional): a path to a directory of precedent files — decisions
# already made, each with the reasoning that produced it. Keel reads that
# directory and nothing else: it never clones, pulls, or writes to a remote, so
# the store is only as current as its working copy and the surfaces say so
# rather than blocking on it. The path may sit outside this repository, which is
# how one store serves several projects.
#
# A declared path that is not there behaves exactly as no declaration — the
# state a fresh clone and CI land in, since the store below is private.
#
# What this does NOT do: a precedent informs a decision and never substitutes
# for a proof. Gates, evidence, Review, and the write guard are untouched by
# anything in the store. A precedent also never moves a decision out of the
# categories that require asking; it answers a recurrence within one.

authorize:
  - commit
  - push
  - release
  - archive
  # Declared 2026-09-24 so the repository that ships the scoped form is the one
  # that demonstrates it, as the bare-list `triage:` below already records for
  # its own compatibility. It also closes the gap that motivated the form:
  # `change-close` asks an unresolved follow-up for a durable owner and accepts
  # an https reference, and until now nothing here could create one.
  - issue:TanglmChris/keel

# TanglmChris/decision-precedents, a private repository. Every other clone of
# this one — including CI — will not have it, and that is the point: a declared
# path that is not there must behave exactly as no declaration.
precedents: ../decision-precedents

# triage (optional): what admits work into an unattended run. Two sources,
# either sufficient on its own — the labels an issue carries, and the issue
# numbers listed here:
#
#   triage:
#     labels:
#       - auto
#     issues:
#       - 62
#
# A bare list written directly under `triage:` still means labels, unchanged.
#
# Evaluate with `keel triage --labels <labels> --issue <n>`, passing what `gh`
# returned — Keel never fetches the issue, because a check that reaches the
# network trades the local, offline, deterministic evaluation that makes its
# answer worth trusting. At least one of the two is required; supplying neither
# is asking for a fetch. An absent or empty block admits nothing, which is the
# default, and a block Keel cannot fully read admits nothing either, naming the
# entry that failed rather than granting the rest of the list.
#
# The unit is one issue, deliberately: a human applies a label, or types a
# number, for one specific issue, so the policy authorizes a class curated one
# issue at a time rather than a guess about which issues look easy. The two
# differ only in where the decision is written down. A label writes it on the
# issue, where the reporter sees an operational switch mixed into the
# vocabulary they were asked to classify with, and where Keel cannot verify a
# human applied it — if your automation can label issues, that source is
# broader than it appears. An issue number writes it here, in a file only a
# committer can change, that appears in a diff and can be narrowed one entry
# at a time.
#
# What this does NOT do: admission answers "may this begin" and nothing after
# it. Alignment still escalates material choices, every gate still runs, and the
# write guard still binds. It also never authorizes a merge — an unattended run
# may open a pull request and may not merge one, and no key here changes that.
# `merge:` below does not either: it describes how the repository merges, and
# grants the agent nothing.
# Admission comes from this declaration and never from a precedent.
#
# Declared 2026-07-29 by the owner, and left in the bare-list form on purpose:
# the repository that ships the compatibility is the one that demonstrates it.
# `auto` is applied to an issue by hand, one issue at a time; nothing else
# admits work here.

triage:
  - auto

# delegation (optional): capability metadata for implementation delegates.
# Model choice does not need this block. An absent tier is not inferred and
# does not forbid guarded implementation. Helpers are read-only and ignore
# implementation metadata. A task-authored tier takes precedence.
#
#   delegation:
#     tier: standard
#
# Accepted: routine, standard, deep. Invalid declared metadata refuses
# implementation rather than silently substituting a tier. Keel neither
# selects nor observes a concrete model. Task write authority and a matching
# active guard remain required; the current agent re-runs each M<n> check and
# owns Review and completion. Host policy remains authoritative.
#
# This repository declares no capability metadata.

# full_mode_paths (optional): the paths whose change always routes Full,
# whatever the diff size says. Routing is the first decision of a session, and
# the size heuristic — roughly three files or a hundred lines — is a proxy for
# risk rather than risk itself. Where a repository's risk does not track diff
# size, this is where it says so:
#
#   full_mode_paths:
#     - results/experiments.jsonl: append-only; a one-field diff is not revertible
#
# Each entry carries its reason, and an entry without one is reported rather
# than read. A bare path says a file is special without saying what makes it
# so, and the agent reading it cannot then recognise the sibling the list does
# not name — the reason is the part that transfers.
#
# One direction only. There is no key that holds a path *out* of the complete
# flow however large its change. Every other declaration in this file removes a
# confirmation and never a gate, and a routing entry that skipped the flow would
# be the first to break that; a project wanting less process declares nothing
# and leaves the judgement where it already was.
#
# The path's shape is read and its existence is not: an entry may name a file
# that does not exist yet, which is much of the point — the schema change that
# has not happened is the one worth catching.
#
# What this does NOT do: Keel gates no routing decision. Routing decides whether
# a change is created, so there is no change for a gate to bind to. What Keel
# does is put the rule and this declaration in front of the agent at the moment
# it decides — `keel context` reports what is declared, and `keel --doctor`
# reports the declaration's health. A declaration Keel cannot fully read routes
# every change Full until it is corrected: the other blocks here fail toward
# more scrutiny, and for this one more scrutiny is more Full mode.
#
# This repository declares none. Its risk does track diff size.

# merge (optional): who merges into the default branch. `human`, or
# `repository:<check>` when the repository merges on its own rule — GitHub
# auto-merge behind a required status check — naming the check it merges on. A
# bare `repository` is refused: "no person reviews this" is only honest beside
# what replaced the person. This is not a permission. The agent never merges
# whatever this says; `authorize:` has no `merge` entry and should not gain one.
# Keel reads this claim and never GitHub, so it cannot verify auto-merge or
# branch protection is actually on — it reports what the owner declared.
#
# Declared here since 5.72.0. This repository does not use GitHub's auto-merge
# setting: the `land` job in `.github/workflows/publish.yml` merges an owner's
# pull request into `main` once its head commit passed `full-gate`, and branch
# protection on `main` requiring `full-gate` refuses the merge if that job is
# ever wrong. No person reviews before merge; `full-gate` is the last gate.
merge: repository:full-gate
