# Keel project configuration.
#
# Fourteen independent declarations live here, each documented below in this
# order: fast_check, which names a command; authorize, which names repository
# actions this project has decided may proceed without being asked each time;
# precedents, which points at a directory of decisions already made and the
# reasoning behind them; triage, which names which work may start without being
# asked about at all; full_mode_paths, which names the paths whose change always
# takes the complete flow; executor_tier, which names how much stepwise
# guidance this project's skills should load; merge, which names who merges
# into the default branch; external_agents, which names the external model CLIs
# this project allows and the paths that must not be handed to one;
# read_only_roles, which names the chat roles whose sessions own no change;
# issue_roles, which names the chat role each issue label routes to; patrol,
# which names the role that runs `keel patrol` and how often; shift, which
# names how a CLI hand-over starts the new session and how many old ones stay
# listed; branches, which names the trunks a task branch counts as merged into
# and the branches never to delete; and owner_language, which names the
# language every message to the owner is written in.

# fast_check (optional): your project's fast inner-loop check — a
# seconds-scale command run at a local pre-push (see
# `keel --install --with-git-hooks`) and during iteration. The full or slow
# suite belongs to CI or `keel gate change-close`, not the local pre-push.
#
# Example:
#   fast_check: npm test -- --fast

# authorize (optional): standing authorization for repository actions. The
# accepted names are the whole vocabulary — commit, push, push:<branch glob>[@<role>],
# release, archive, continuation, issue:<owner>/<repo>[@<role>], protocol-refresh,
# chat-reply:<group>[@<role>], issue-close:<owner>/<repo>[@<role>], cleanup:scratch[@<role>],
# push-protected:<branch glob>[@<role>], shift-restore, self-shift,
# delete-branch:merged[@<role>] — and an unrecognized entry is reported
# with the accepted names rather than silently granted or silently dropped, so
# the declaration authorizes nothing until it is corrected. An absent or empty
# block authorizes nothing, which is the default and leaves behavior exactly as
# it was before the block existed.
#
# `issue`, `issue-close`, `cleanup`, `chat-reply`, and `push-protected` are the names that carry
# the resource they reach, and each is refused without one. `push` may carry
# branch globs (`push:claude/*`), and only that scope is enforced: the Claude
# write guard refuses a `git push` to any other branch (#257), and one that also
# carries annotated tags (`--follow-tags`, `push.followTags`) unless every branch
# it pushes is `push-protected` (#327).
# `push-protected:main@<role>` names a branch the guard asks the user about,
# one push at a time, instead of refusing (#280). `chat-reply:<group>` lets a session answer,
# in that chat group, a record addressed to its role, and nothing the record
# asks for beyond the answer; in a Slack-enabled group a reply leaves the
# machine, which is why the group is named.
#
# For `issue`, the reasoning is that every other name acts on this checkout, so the
# declaration and the thing it permits are the same size; the credentials that
# open an issue are account-wide, so a bare `issue` would silently be the widest
# entry in this file — wider than `push`. Naming the repository is what keeps
# the entry no bigger than what it says. Keel carries that scope to `--doctor`
# and to the compiled capsule and does not enforce it: it invokes no tracker
# client and cannot observe one, exactly as it never commits.
#
# A task that authors no `Autonomy boundary:` inherits what is declared here,
# and the compiled capsule names this file as that entry's source. A task that
# authors its own boundary keeps it; the declaration never overrides one.
#
# `protocol-refresh` covers running the refresh `keel context` names when this
# repository's managed protocol block is older than the running Keel: never
# while a task's write guard is active, and never the commit of what it wrote.
#
# `shift-restore` covers what a session started by a shift change on the Claude
# desktop app does right after `keel shift resume`: turning its own Remote
# Control back on and renaming itself back (#319). Nothing else. `self-shift`
# covers the outgoing side: the four steps `keel shift ready --wake` prints
# there once the note is stored. Neither decides that a shift happens.
#
# `continuation` is accepted and changes nothing: since #414, moving from a
# durably complete task to the next unchecked task of the same change, inside a
# change whose tasks.md the owner approved, needs no confirmation by default.
# The next task still starts through its own gate with its own fingerprint,
# and no repository action rides along with it.
#
# What this does NOT do: it removes the confirmation, never the proof. Every
# gate, evidence requirement, semantic Review, and the write guard run exactly
# as they do without it — `keel gate task-complete` returns the same verdict
# and the same failure text either way. It is also not a trigger: it authorizes
# an action the workflow already reached, and schedules nothing.
authorize:
  - commit
  - push
  - release
  - archive
  # Declared 2026-10-13 by the owner's decision on #319: a keel-maint shift on
  # the desktop app restores its Remote Control and title without asking.
  - shift-restore
  # Declared 2026-10-13 by the owner's decision on #319: a keel-maint session
  # takes its own outgoing shift steps on the desktop app without asking.
  - self-shift
  # Declared 2026-09-24 so the repository that ships the scoped form is the one
  # that demonstrates it, as the bare-list `triage:` below already records for
  # its own compatibility. It also closes the gap that motivated the form:
  # `change-close` asks an unresolved follow-up for a durable owner and accepts
  # an https reference, and until now nothing here could create one.
  - issue:TanglmChris/keel
  # Declared 2026-10-26 by the owner's choice to clear keel-maint's merged
  # task branches with `keel branches prune` (#469), scoped to that role.
  - delete-branch:merged@keel-maint

# precedents (optional): a path to a directory of precedent files — decisions
# already made, each with the reasoning that produced it. Keel reads that
# directory and nothing else: it never clones, pulls, or writes to a remote, so
# the store is only as current as its working copy and the surfaces say so
# rather than blocking on it. The path may sit outside this repository, which is
# how one store serves several projects.
#
# A declared path that is not there behaves exactly as no declaration — the
# state a fresh clone and CI land in when the store is private.
#
# What this does NOT do: a precedent informs a decision and never substitutes
# for a proof. Gates, evidence, Review, and the write guard are untouched by
# anything in the store. A precedent also never moves a decision out of the
# categories that require asking; it answers a recurrence within one.

# triage (optional): what admits work into an unattended run. Two sources,
# either sufficient on its own — the labels an issue carries, and the issue
# numbers listed here:
#
#   triage:
#     labels:
#       - auto
#     issues:
#       - 62
#
# A bare list written directly under `triage:` still means labels, unchanged.
#
# Evaluate with `keel triage --labels <labels> --issue <n>`, passing what `gh`
# returned — Keel never fetches the issue, because a check that reaches the
# network trades the local, offline, deterministic evaluation that makes its
# answer worth trusting. At least one of the two is required; supplying neither
# is asking for a fetch. An absent or empty block admits nothing, which is the
# default, and a block Keel cannot fully read admits nothing either, naming the
# entry that failed rather than granting the rest of the list.
#
# The unit is one issue, deliberately: a human applies a label, or types a
# number, for one specific issue, so the policy authorizes a class curated one
# issue at a time rather than a guess about which issues look easy. The two
# differ only in where the decision is written down. A label writes it on the
# issue, where the reporter sees an operational switch mixed into the
# vocabulary they were asked to classify with, and where Keel cannot verify a
# human applied it — if your automation can label issues, that source is
# broader than it appears. An issue number writes it here, in a file only a
# committer can change, that appears in a diff and can be narrowed one entry
# at a time.
#
# What this does NOT do: admission answers "may this begin" and nothing after
# it. Alignment still escalates material choices, every gate still runs, and the
# write guard still binds. It also never authorizes a merge — an unattended run
# may open a pull request and may not merge one, and no key here changes that.
# `merge:` below does not either: it describes how the repository merges, and
# grants the agent nothing.
# Admission comes from this declaration and never from a precedent.
#
# Declared 2026-07-29 by the owner, and left in the bare-list form on purpose:
# the repository that ships the compatibility is the one that demonstrates it.
# `auto` is applied to an issue by hand, one issue at a time; nothing else
# admits work here.
triage:
  - auto

# full_mode_paths (optional): the paths whose change always routes Full,
# whatever the diff size says. Routing is the first decision of a session, and
# the size heuristic — roughly three files or a hundred lines — is a proxy for
# risk rather than risk itself. Where a repository's risk does not track diff
# size, this is where it says so:
#
#   full_mode_paths:
#     - results/experiments.jsonl: append-only; a one-field diff is not revertible
#
# Each entry carries its reason, and an entry without one is reported rather
# than read. A bare path says a file is special without saying what makes it
# so, and the agent reading it cannot then recognise the sibling the list does
# not name — the reason is the part that transfers.
#
# One direction only. There is no key that holds a path *out* of the complete
# flow however large its change. Every other declaration in this file removes a
# confirmation and never a gate, and a routing entry that skipped the flow would
# be the first to break that; a project wanting less process declares nothing
# and leaves the judgement where it already was.
#
# The path's shape is read and its existence is not: an entry may name a file
# that does not exist yet, which is much of the point — the schema change that
# has not happened is the one worth catching.
#
# What this does NOT do: Keel gates no routing decision. Routing decides whether
# a change is created, so there is no change for a gate to bind to. What Keel
# does is put the rule and this declaration in front of the agent at the moment
# it decides — `keel context` reports what is declared, and `keel --doctor`
# reports the declaration's health. A declaration Keel cannot fully read routes
# every change Full until it is corrected: the other blocks here fail toward
# more scrutiny, and for this one more scrutiny is more Full mode.
#
# This repository declares none. Its risk does track diff size.

# executor_tier (optional): `standard` or `high` (#135). A skill's stepwise
# guidance lives in a `guidance.md` beside its `SKILL.md`; `high` skips reading
# it, and `standard`, the default, reads it. An absent or misspelled value reads
# it too, so the worst an unconfigured repository does is pay for a read.
# `keel context` and `keel --doctor` report the tier.
#
# Example:
#   executor_tier: high
#
# What this does NOT do: the tier reaches guidance and nothing else — no gate,
# criterion, evidence requirement, or Review moves with it, and a guidance file
# is checked to state no criterion.
#
# This repository declares none.

# merge (optional): who merges into the default branch. `human`, or
# `repository:<check>` when the repository merges on its own rule — GitHub
# auto-merge behind a required status check — naming the check it merges on. A
# bare `repository` is refused: "no person reviews this" is only honest beside
# what replaced the person. This is not a permission. The agent never merges
# whatever this says; `authorize:` has no `merge` entry and should not gain one.
# Keel reads this claim and never GitHub, so it cannot verify auto-merge or
# branch protection is actually on — it reports what the owner declared.
#
# Declared here since 5.72.0. This repository does not use GitHub's auto-merge
# setting: the `land` job in `.github/workflows/publish.yml` merges an owner's
# pull request into `main` once its head commit passed `full-gate`, and branch
# protection on `main` requiring `full-gate` refuses the merge if that job is
# ever wrong. No person reviews before merge; `full-gate` is the last gate.
merge: repository:full-gate

# external_agents (optional): the external model CLIs (codex, dsh, ...) this
# project allows, and the paths that must not be sent to one. `keel agents
# brief` compiles the brief such an agent is handed and refuses it when the
# agent is not allowed or a path the brief names matches egress_deny:
#
#   external_agents:
#     allow:
#       - codex
#     egress_deny:
#       - secrets/**: vendor keys under NDA
#
# An absent block allows nothing: sending the repository to another provider
# is a decision a project makes once, explicitly. Each egress_deny entry
# carries its reason, and an entry Keel cannot read refuses every brief until
# it is corrected, because a deny list that dropped an entry would send what it
# was written to keep. Tool paths, templates and pitfalls are machine facts and
# live in Keel's catalog and ~/.keel/agents.json, not here (`keel agents`).
#
# What this does NOT do: Keel launches no agent and cannot observe what one
# reads beyond the brief, so egress_deny guards what is handed over, not what
# an agent can open in its directory. The session re-runs every check before
# recording Evidence.
#
# Declared 2026-10-11 by the owner, who decided that issue #254's
# implementation is handed to codex from a Claude session. No egress_deny:
# this repository is public, so nothing in it is withheld from the provider.
external_agents:
  allow:
    - codex

# read_only_roles (optional): chat roles whose sessions review, verify, or
# coordinate and never own an OpenSpec change. In a worktree bound to one,
# `keel context` reports one idle line naming the role, and the session note
# stops asking it to select an owner; `keel context --change` still selects.
#
# Example:
#   read_only_roles:
#     - review
#
# This repository declares none.

# issue_roles (optional): `keel patrol --issues <gh output>` sends the role a
# label names one direct message per update of an issue carrying it (#242).
# `keel tick` fetches that output with `gh` itself when a route is declared
# (#473).
# One `<label>: <role>` per line; a label may contain a colon. A key may
# name a set of labels joined by ` + ` (#433), matching an issue that carries
# all of them; when one matching route's labels are a subset of another's,
# only the larger set's role is sent the update. A quoted key is one label.
#
# Example:
#   issue_roles:
#     role:verify: verify
#     design: design-iecc
#     design + dmc_rmw: design-rmw
#
# This repository declares none.

# patrol (optional): the role whose sessions run `keel patrol` on a host
# schedule, and its interval (#260), or a list of `- role:` items, one per
# team coordinator, each scoped with `scope: group:<name>` to the members of
# that chat group (#434). Keel schedules nothing; it reminds that
# role's new sessions and `keel shift resume` to re-create the schedule, since
# a session's schedule ends with the session. `host_task:` names a host
# scheduled task that runs it instead, which outlives the session, and the
# reminder then asks only to confirm it is enabled; `model:` is the model that
# task declares, passed through and never chosen by Keel. `keel patrol task`
# prints the task to install with the host's own tool (#295). Without the
# desktop app, `runner: tick` lets launchd run `keel tick`, which runs the
# patrol once its recommended next run has passed, and `cadence: adaptive` lets
# the patrol choose that next run by what it saw (#356; docs/cli-team.md). The
# tick passes free disk against `disk_min_gb:` (default 20), and the weekly
# quota read from the file `quota_file:` names when it is under 6 hours old;
# Keel runs no command to get quota (#456).
#
# Example:
#   patrol:
#     role: iecc-pm
#     every: 30m
#     host_task: rtl-ppa-pm-patrol
#
# Declared 2026-10-19 by the owner's decision to install a resident `keel tick`
# for this repository, so a keel-maint CLI session's `keel shift ready --wake`
# is carried out (stop the old session, start the new one) and an ended session
# addressed in the chat is resumed. launchd runs `keel tick` every 300 s
# (`keel tick task` prints the job); the patrol itself runs when its
# recommended next run has passed.
patrol:
  role: keel-maint
  every: 1h
  runner: tick
  cadence: adaptive

# shift (optional): how a Claude Code CLI hand-over runs (#357, docs/cli-team.md).
# `permission_mode:` is the mode the new session starts in — default,
# acceptEdits, auto, plan or bypassPermissions; `auto` when absent.
# `keep_old_sessions:` is how many stopped old shifts of a role stay listed in
# `claude agents` and on claude.ai; 0 when absent or unreadable (#418), so the
# old shift is removed with `claude rm` once Keel's store holds its transcript,
# and `keel shift history <role> --show <id>` still prints it in full.
#
# Example:
#   shift:
#     permission_mode: auto
#     keep_old_sessions: 1
#
# This repository declares none.

# branches (optional): which of a role's task branches count as merged (#469).
# The remote default branch is always a trunk; `trunk:` names more, such as a
# team's integration branch, each read as origin/<name>. `keep:` names branch
# globs never to delete (`*` within a `/` segment, `**` across them).
# `keel branches` lists the role's branches merged into a trunk, checked out
# nowhere, and checked out before in a worktree bound to the role; it fetches
# and deletes nothing. `keel branches prune` deletes them, local and remote,
# only under `authorize: delete-branch:merged`, recording each with its sha
# first in the chat store's branches/deleted.jsonl. The trunks are also the
# default of `keel chat wait --commit` without `--branch` (#477) when `trunk:`
# names at least one.
#
# Example:
#   branches:
#     trunk:
#       - cbb_open
#     keep:
#       - release/**
#
# This repository declares none.

# owner_language (optional): a language tag such as zh or en (#305). Every
# message to the owner — replies, summaries, reports, and the question and
# options of a structured-choice prompt — is in that language, whatever the
# work and its sources are in; `keel context`, the session-start note, and the
# chat hook on every prompt restate it. A value that is not a tag is ignored.
owner_language: zh
