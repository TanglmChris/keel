name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

# One group for the whole workflow, and one for the package it publishes to.
# Eleven releases created in a loop are eleven simultaneous jobs against one npm
# package; nothing was lost when that happened, but the registry's read side
# reported published versions as missing for several minutes and two re-runs were
# triggered on that false reading (#153).
#
# `cancel-in-progress: false` is the load-bearing half. The default is `true`,
# which would cancel a queued publish when the next release fires — losing a
# version for real rather than appearing to. A group keyed per release, such as
# `publish-${{ github.ref }}`, would serialize nothing while looking like a fix:
# the thing being protected is the package, and there is one of those.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # OIDC trusted publishing requires npm >= 11.5.1.
      # Pin to npm 11 (npm 12 requires Node >= 22.22).
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # The full validation suite is Windows/CLI-specific and runs in the
      # pre-push hook before any release tag is pushed, so it is not re-run here.

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
