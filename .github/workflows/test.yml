name: Full gate

# Keel's verification-layering convention splits verification into a fast
# inner-loop check (the local pre-push hook, seconds) and the full gate (CI or
# `keel gate change-close`). This workflow is that full gate for Keel itself.
# The two native-plugin scenarios probe the codex and claude CLIs, which no
# runner provides; they report themselves skipped here and still run on an
# author's machine before any release tag is pushed.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run the full gate
        run: npm test

      # `keel chat bridge` uses Node's built-in WebSocket, which starts at
      # Node 22, so its three scenarios report themselves skipped on the
      # Node 20 floor above. They run here, in the same job, so the required
      # check still covers them (#187).
      - name: Setup Node.js 22 for the chat bridge
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the chat bridge scenarios on Node 22
        run: |
          for scenario in chat-bridge-outbound chat-bridge-inbound chat-bridge-lifecycle; do
            node scripts/run_python.js scripts/validate_plugin.py --scenario "$scenario"
          done
